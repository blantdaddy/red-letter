<title>Red Letter Gospels</title>
<meta name="description" content="Study the words of Jesus in the King James Gospels.">
<meta name="theme-color" content="#1B2A4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a printed red-letter Bible reimagined as an app. Left rail (desktop) or bottom tabs (phone); one centred reading column. */
:root{
  --paper:#F3F4F7; --page:#FFFFFF; --ink:#18202E; --muted:#5C6577; --line:#DCE0E8;
  --red:#A8201A; --lapis:#24427F; --gold:#9A7316; --soft:#E9EDF5;
  --hl-gold:#F7E3A1; --hl-rose:#F6CFD0; --hl-sky:#CFE0F7; --hl-sage:#D4EBD3;
  --shadow:0 1px 2px rgba(24,32,46,.06),0 8px 24px rgba(24,32,46,.06);
  --f-display:"IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --f-text:"Literata","Iowan Old Style",Georgia,"Times New Roman",serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs:1.14rem; --rail:240px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E121A; --page:#151B26; --ink:#E4E7EE; --muted:#9AA3B4; --line:#283143;
  --red:#F0857A; --lapis:#9DB4F2; --gold:#D8B45C; --soft:#1C2433;
  --hl-gold:#5A4A17; --hl-rose:#5B2A2E; --hl-sky:#1F3A5E; --hl-sage:#25432A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E121A; --page:#151B26; --ink:#E4E7EE; --muted:#9AA3B4; --line:#283143;
  --red:#F0857A; --lapis:#9DB4F2; --gold:#D8B45C; --soft:#1C2433;
  --hl-gold:#5A4A17; --hl-rose:#5B2A2E; --hl-sky:#1F3A5E; --hl-sage:#25432A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px;border-radius:4px}
a{color:var(--lapis)}
h1,h2,h3{text-wrap:balance;margin:0}
.wj{color:var(--red)}
.nored .wj{color:inherit}
.sc{font-variant:small-caps;letter-spacing:.04em}
i.add{font-style:italic;opacity:.85}
.gl{text-decoration:underline dotted color-mix(in srgb,var(--muted) 70%,transparent);text-underline-offset:3px;cursor:help}
.nogloss .gl{text-decoration:none;cursor:inherit}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh;align-content:start}
.rail{position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;background:var(--page)}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.45rem;line-height:1;display:block}
.brand small{font-size:.64rem;letter-spacing:.1em;white-space:nowrap;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;color:var(--muted);font-weight:500}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--soft);color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--red)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:.78rem;color:var(--muted)}
.meter{height:5px;background:var(--soft);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--red);border-radius:9px;transition:width .4s}
.sync{display:flex;gap:6px;align-items:center}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on::before{background:#3F9D5A}
.main{min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:32px 96px}
.wrap{max-width:46rem;margin:0 auto}
.wide{max-width:64rem;margin:0 auto}
.topbar{display:none}
.tabs{display:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;justify-content:space-between;padding:10px 16px;background:color-mix(in srgb,var(--page) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar .brand b{font-size:1.2rem}
  .topbar .brand-mark{width:26px;height:26px}
  .icon-btn{border:0;background:none;padding:6px;border-radius:8px;color:var(--muted);display:inline-flex}
  .icon-btn svg{width:22px;height:22px}
  .tabs{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--page);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--muted);padding:4px 0;font-weight:500}
  .tabs button svg{width:21px;height:21px}
  .tabs button[aria-current="page"]{color:var(--red)}
  .main{padding-block:20px 110px}
}

/* ---------- Common ---------- */
.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.display{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,5vw,2.9rem);line-height:1.05}
.h2{font-family:var(--f-display);font-weight:400;font-size:1.7rem;line-height:1.15}
.lede{font-family:var(--f-text);font-size:1.05rem;color:var(--muted);max-width:38rem}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--page);padding:8px 14px;border-radius:999px;font-weight:500;font-size:.88rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--lapis);border-color:var(--lapis);color:var(--page)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--page)}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--page);border-radius:999px;padding:3px 10px;font-size:.8rem;color:var(--lapis);font-weight:500}
button.chip:hover{border-color:var(--lapis)}
.card{background:var(--page);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.rule{height:1px;background:var(--line);border:0;margin:8px 0}
.ornament{display:flex;align-items:center;gap:12px;color:var(--gold);justify-content:center;margin:28px 0}
.ornament::before,.ornament::after{content:"";height:1px;flex:1;max-width:120px;background:var(--line)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.scripture{font-family:var(--f-text);font-size:var(--fs);line-height:1.75}
.scripture sup{font-family:var(--f-ui);font-size:.62em;color:var(--gold);font-weight:600;margin-right:.25em;vertical-align:.45em}
.ref{font-family:var(--f-ui);font-weight:600;font-size:.8rem;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
blockquote.passage{margin:0;padding:14px 0 14px 18px;border-left:2px solid var(--gold)}
blockquote.passage p{margin:0 0 .4em}

/* ---------- Today ---------- */
.hero{padding:6px 0 10px;display:flex;flex-direction:column;gap:14px}
.votd{position:relative;background:var(--page);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4vw,40px);box-shadow:var(--shadow);overflow:hidden}
.votd::before{content:"\201C";position:absolute;right:18px;top:-24px;font-family:var(--f-display);font-size:10rem;color:var(--soft);line-height:1;pointer-events:none}
.votd .scripture{font-size:clamp(1.25rem,2.6vw,1.6rem);line-height:1.55;position:relative}
.votd footer{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.today-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));margin-top:16px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--soft)}
.ring .fg{stroke:var(--red);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{fill:var(--ink);font:600 16px var(--f-ui)}
.books4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.books4 button{border:1px solid var(--line);background:var(--page);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.books4 button:hover{border-color:var(--red)}
.books4 b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.books4 span{font-size:.68rem;color:var(--muted);text-align:center}
@media (max-width:420px){.books4{grid-template-columns:repeat(2,1fr)}}

/* ---------- Reader ---------- */
.reader-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:22px}
.picker{display:flex;gap:8px;flex-wrap:wrap}
.sel{border:1px solid var(--line);background:var(--page);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.9rem}
.chap-head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.chap-head .eyebrow{font-family:var(--f-display);text-transform:none;letter-spacing:.02em;font-size:1.02rem;font-weight:400;font-style:italic;color:var(--muted)}
.chap-title{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.12}
.text{font-family:var(--f-text);font-size:var(--fs);line-height:1.85}
.text p{margin:0 0 .9em;text-indent:0}
.text .dropnum{float:left;font-family:var(--f-text);font-weight:400;font-size:3.9em;line-height:.9;margin:.04em .16em 0 0;color:var(--red)}
.nf{font-family:var(--f-text);font-size:.88em;letter-spacing:0}
.v{border-radius:4px;transition:background .2s;cursor:pointer;-webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.v sup{font-family:var(--f-ui);font-size:.6em;color:var(--gold);font-weight:600;margin:0 .2em 0 .1em;vertical-align:.5em;user-select:none}
.nonum .v sup{display:none}
.v.sel-v{outline:2px dashed var(--lapis);outline-offset:1px}
.v.flash{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.v[data-hl="gold"]{background:var(--hl-gold)}
.v[data-hl="rose"]{background:var(--hl-rose)}
.v[data-hl="sky"]{background:var(--hl-sky)}
.v[data-hl="sage"]{background:var(--hl-sage)}
.v .notemark{display:inline-block;width:.55em;height:.55em;background:var(--lapis);border-radius:50%;margin-left:.2em;vertical-align:.25em}
.verses .v{display:block;padding:2px 0;margin-bottom:.15em}
.verses p{margin:0}
.verses .dropnum{display:none}
.chap-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.chap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.chap-grid button{border:1px solid var(--line);background:var(--page);border-radius:8px;padding:8px 0;font-weight:600;font-variant-numeric:tabular-nums}
.chap-grid button.done{background:var(--soft);color:var(--red)}
.chap-grid button.cur{border-color:var(--red)}
.intro-card{margin-bottom:26px}
.intro-card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0;font-size:.9rem}
.intro-card dt{color:var(--muted);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
.intro-card dd{margin:0}
details.intro-card>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.intro-card>summary::-webkit-details-marker{display:none}
details.intro-card>summary::after{content:"+";font-size:1.2rem;color:var(--muted)}
details[open].intro-card>summary::after{content:"−"}

/* ---------- Sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.42);z-index:50}
.sheet{position:fixed;z-index:60;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);background:var(--page);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.18);max-height:85vh;overflow:auto}
.modal{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100% - 24px));max-height:min(86vh,900px);overflow:auto;background:var(--page);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.swatches{display:flex;gap:10px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
textarea{width:100%;min-height:96px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-family:var(--f-text);font-size:1rem;line-height:1.5;resize:vertical}
input[type="search"],input[type="text"]{width:100%;border:1px solid var(--line);background:var(--page);border-radius:12px;padding:12px 14px;font-size:1rem}
.toggle{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.switch{appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--page);transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch:checked{background:var(--red)}
.switch:checked::after{left:21px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 12px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--red)}
.pop{position:fixed;z-index:70;max-width:300px;background:var(--ink);color:var(--page);padding:10px 12px;border-radius:10px;font-size:.84rem;line-height:1.45;box-shadow:var(--shadow)}
.pop b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.05rem;margin-bottom:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--page);padding:8px 16px;border-radius:99px;font-size:.86rem;font-weight:500}

/* ---------- Studies ---------- */
.study-card{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:var(--page);border-radius:14px;padding:18px;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.study-card:hover{border-color:var(--red);transform:translateY(-2px)}
.study-card h3{font-family:var(--f-display);font-weight:400;font-size:1.35rem;line-height:1.15}
.study-card .meta{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-top:auto;padding-top:6px}
.study-card .done{color:var(--red);font-weight:600}
.study-part{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:4px 14px;padding:20px 0;border-top:1px solid var(--line)}
.study-part .n{font-family:var(--f-text);font-size:1.3rem;color:var(--gold);line-height:1.2}
.study-part h3{font-family:var(--f-display);font-weight:400;font-size:1.3rem;line-height:1.2}
.study-part .note{font-size:.93rem;color:var(--muted);margin:8px 0 0}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;margin-top:8px}
.pair .ot{border-left-color:var(--muted)}
.memory{background:var(--soft);border-radius:14px;padding:18px 20px;margin:20px 0}
.qs{display:flex;flex-direction:column;gap:18px;counter-reset:q}
.qs label{display:block;font-family:var(--f-text);font-size:1.02rem;margin-bottom:8px}
.qs label::before{counter-increment:q;content:counter(q) ". ";color:var(--red);font-family:var(--f-display)}
.tabsline{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto}
.tabsline button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabsline button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}

/* Harmony */
.harm-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--page)}
table.harm{border-collapse:collapse;width:100%;min-width:640px;font-size:.86rem}
.harm th,.harm td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.harm thead th{font-family:var(--f-display);font-weight:400;font-size:1.05rem;position:sticky;top:0;background:var(--page)}
.harm tbody th{font-weight:500;font-family:var(--f-text)}
.harm tr:last-child td,.harm tr:last-child th{border-bottom:0}
.harm .none{color:var(--line)}
.harm .num{color:var(--muted);font-variant-numeric:tabular-nums;width:2rem}

/* Plans */
.plan-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:4px;margin:14px 0}
.plan-days span{aspect-ratio:1;border-radius:5px;background:var(--soft);max-width:100%}
.plan-days span.on{background:var(--red)}
.plan-days span.next{outline:2px solid var(--gold)}
.day-list{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:auto 3.6rem minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.day input{width:20px;height:20px;accent-color:var(--red)}
.day .dn{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;font-weight:600}
.day .dt{min-width:0}
.day .dt b{font-weight:600}
.day .dt small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.done .dt b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--red)}

/* Search */
.result{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.result:hover .ref{color:var(--red)}
.result .scripture{font-size:1rem;line-height:1.6}
mark{background:var(--hl-gold);color:inherit;border-radius:3px;padding:0 1px}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}

/* Journal */
.jitem{padding:16px 0;border-bottom:1px solid var(--line)}
.jitem .scripture{font-size:1rem;line-height:1.6}
.jnote{font-family:var(--f-text);background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:8px;white-space:pre-wrap}
.empty{border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}

/* Guide */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:4px 26px}
.gloss div{padding:10px 0;border-bottom:1px solid var(--line)}
.gloss b{font-family:var(--f-display);font-weight:400;font-size:1.15rem;display:block}

/* Quiz */
.quiz-text{font-family:var(--f-text);font-size:1.15rem;margin:8px 0 14px}
.quiz-opts{display:grid;gap:8px}
.quiz-opt{text-align:left;border:1px solid var(--line);background:var(--page);border-radius:12px;padding:12px 14px;font-size:.98rem}
.quiz-opt:not(:disabled):hover{border-color:var(--lapis)}
.quiz-opt.right{border-color:#3F9D5A;background:color-mix(in srgb,#3F9D5A 14%,var(--page))}
.quiz-opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--page))}
.quiz-opt:disabled{cursor:default;color:var(--ink)}
.quiz-verdict{font-weight:600;margin:14px 0 8px}
.quiz-verdict.ok{color:#3F9D5A}.quiz-verdict.no{color:var(--red)}
.quiz-done{text-align:center;padding:10px 0}
/* Memory */
.mem-card{display:flex;flex-direction:column;gap:10px}
.mem-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mem-steps span{height:5px;border-radius:9px;background:var(--soft)}
.mem-steps span.on{background:var(--red)}
.mem-big{font-size:1.25rem;line-height:1.9;margin-bottom:12px}
.mem-blank{display:inline-block;border-bottom:2px solid var(--muted);line-height:1.2}
.mem-blank.cur{border-bottom-color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent)}
.mem-filled{color:var(--red);font-weight:600}
.mem-bank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.mem-bank .chip{font-size:.95rem;padding:6px 12px;color:var(--ink)}
.mem-bank .chip.used{opacity:.3}
.ml{border:0;background:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;letter-spacing:.06em}
.ml.shown{color:var(--red);letter-spacing:0}
.mem-miss{text-decoration:underline wavy var(--red);text-underline-offset:4px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* Compare */
.cmp{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px;align-items:start}
.cmp-col{background:var(--page);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.cmp-col header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cmp-text{font-size:1rem;line-height:1.7;margin-top:10px}
.uniq{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--gold) 75%,transparent);text-decoration-thickness:1.5px;text-underline-offset:3px}
.nouniq .uniq{text-decoration:none}
@media (max-width:860px){.cmp{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:min(86%,420px);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}.cmp-col{scroll-snap-align:start}}
@media (min-width:861px) and (max-width:1180px){.cmp{grid-template-columns:repeat(min(var(--n),2),minmax(0,1fr))}}
/* Read aloud */
.v.speaking{background:color-mix(in srgb,var(--lapis) 16%,transparent)}
.player{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:12px;align-items:center;background:var(--page);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18);max-width:calc(100% - 24px)}
@media (max-width:860px){.player{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
/* Ask */
.ask-only{display:none!important}
.can-ask .ask-only{display:inline-flex!important}
.ask-out{font-family:var(--f-text);font-size:1rem;line-height:1.65;margin-top:14px}
.ask-out p{margin:0 0 .7em}.ask-out ul{margin:0 0 .7em;padding-left:1.2em}

/* Booklet */
.booklet .cover{padding:40px 0 20px}
.booklet .bk{padding:14px 0;border-bottom:1px solid var(--line)}
.booklet .bq{margin-top:12px;font-family:var(--f-text)}
.booklet .bq p{margin:0 0 4px}
.lines i{display:block;height:1.9em;border-bottom:1px solid var(--line)}
.check89{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:0 24px;margin-top:12px;font-size:.86rem}
.check89>div{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}
.check89 .box{width:12px;height:12px;border:1.5px solid var(--muted);border-radius:2px;flex:none;transform:translateY(1px)}
.check89 .dn{width:1.6rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.booklet section.pb{margin-top:40px}
@media print{.booklet section.pb{break-before:page;margin-top:0}.booklet .harm-wrap{border:0}.booklet table.harm{min-width:0}.booklet .harm thead th{position:static}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Print ---------- */
@media print{
  :root{--paper:#fff;--page:#fff;--ink:#111;--muted:#444;--line:#ccc;--red:#9E1B16;--gold:#7A5A0F;--soft:#f1f1f1}
  html,body{background:#fff}
  .rail,.topbar,.tabs,.reader-bar,.chap-foot,.btn,.no-print,.sheet,.scrim,.toast,.pop{display:none!important}
  .app{display:block}
  .main{padding:0}
  .card,.votd,.study-card{box-shadow:none}
  .v[data-hl]{background:none!important}
  .gl{text-decoration:none}
  .study-part{break-inside:auto;padding:12px 0}
  .study-part h3{break-after:avoid}
  .scripture,.booklet .scripture{font-size:11pt!important;line-height:1.55}
  .booklet .bq{break-inside:avoid}
  .memory{break-inside:avoid}
  textarea{border:0;border-bottom:1px solid #999;border-radius:0;min-height:5em;background:none}
}

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BOOK=Object.fromEntries(BOOKS.map(b=>[b.id,b]));
const ABBR={Matt:"Matt",Matthew:"Matt",Mt:"Matt",Mark:"Mark",Mk:"Mark",Luke:"Luke",Lk:"Luke",John:"John",Jn:"John"};
const OTNAME={Exod:"Exodus",Isa:"Isaiah",Mic:"Micah",Hos:"Hosea",Zech:"Zechariah",Ps:"Psalm",Deut:"Deuteronomy",Lev:"Leviticus"};
const TOTAL=89;

/* ---------- State & sync ---------- */
const KEY="redletter.v1";
const blank=()=>({v:1,updated:0,read:{},hl:{},notes:{},plans:{},answers:{},studies:{},last:{b:"Matt",c:1},plan:"gospels89",memory:{},quiz:{},settings:{rate:0.95,autoNext:true,uniq:true,red:true,nums:true,mode:"para",size:1.14,gloss:true,theme:""}});
let S=blank();
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(blank(),JSON.parse(raw));}catch(e){}
S.settings=Object.assign(blank().settings,S.settings||{});
let viewerName="", remote=null, saveTimer=null, writing=Promise.resolve();
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(remote){clearTimeout(saveTimer); saveTimer=setTimeout(pushRemote,1200);}
  railProgress();
}
function pushRemote(){
  const snap=JSON.parse(JSON.stringify(S));
  writing=writing.then(()=>remote.set({json:JSON.stringify(snap),updated:snap.updated})).catch(e=>{ if(e&&e.code==="unavailable") setTimeout(pushRemote,2500+Math.random()*1500); else setSync(false,"Saved on this device"); });
}
function setSync(on,label){const el=$("#sync"); el.classList.toggle("on",on); el.textContent=label;}
async function connect(){
  const C=window.claude; if(!C||!C.use) return;
  try{
    const [db,user]=await Promise.all([C.use("db"),C.use("user")]);
    if(!db||!user) return;
    try{ const me=await user.me(); const n=((me&&me.name)||"").trim().split(/\s+/)[0]; if(n){ viewerName=n; if(view==="today") render(); } }catch(e){}
    const id=await user.id(); if(!id) return;
    const ref=db.doc("data/users/"+id+"/journal");
    const snap=await ref.get();
    const apply=data=>{ try{ const r=JSON.parse(data.json); if(r&&r.updated>S.updated){ S=Object.assign(blank(),r); S.settings=Object.assign(blank().settings,S.settings||{}); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} applySettings(); render(); } }catch(e){} };
    remote=ref;
    if(snap.exists){ const d=snap.data(); if(d.updated>S.updated) apply(d); else if(S.updated>d.updated) pushRemote(); }
    else if(S.updated) pushRemote();
    setSync(true,"Synced to your account");
    ref.onSnapshot(s=>{ if(s.exists && !s.metadata.hasPendingWrites) apply(s.data()); }, ()=>{});
  }catch(e){ remote=null; }
}

/* ---------- Text helpers ---------- */
const GLOSS_RE=new RegExp("\\b("+GLOSS.map(g=>g[0]).join("|")+")\\b","gi");
function glossFor(word){const w=word.toLowerCase(); for(const g of GLOSS){ if(new RegExp("^(?:"+g[0]+")$","i").test(w)) return g; } return null;}
function fmt(raw,{gloss=true}={}){
  let s=esc(raw.replace(/^¶\s*/,""));
  s=s.replace(/\bLORD(['’]S)?\b/g,(m)=>"\u0004"+m.toLowerCase()+"\u0005");
  s=s.replace(/\bGOD\b/g,"\u0004god\u0005");
  if(gloss&&S.settings.gloss) s=s.replace(GLOSS_RE,m=>"\u0001"+m+"\u0002");
  s=s.replace(/\{/g,'<span class="wj">').replace(/\}/g,"</span>").replace(/\[\s*/g,'<i class="add">').replace(/\s*\]/g,"</i> ").replace(/<\/i> ([,.;:?!’'”)])/g,"</i>$1");
  s=s.replace(/\u0001([^\u0002]+)\u0002/g,'<span class="gl" data-gl="$1">$1</span>');
  s=s.replace(/\u0004([^\u0005]+)\u0005/g,'<span class="sc">$1</span>');
  return s;
}
const plain=raw=>raw.replace(/^¶\s*/,"").replace(/[{}\[\]]/g,"").replace(/\s+/g," ").trim();
function parseRef(ref){
  const m=ref.trim().match(/^(\w+)\s+(\d+)(?::(\d+)(?:-(\d+)(?::(\d+))?)?)?$/);
  if(!m) return null;
  const b=ABBR[m[1]]||m[1], c1=+m[2];
  let v1=m[3]?+m[3]:1, c2=c1, v2;
  if(!m[3]) v2=null; else if(m[5]){c2=+m[4]; v2=+m[5];} else v2=m[4]?+m[4]:v1;
  return {b,c1,v1,c2,v2,ot:!G[b]};
}
function versesOf(ref){
  const r=typeof ref==="string"?parseRef(ref):ref; if(!r) return [];
  const out=[];
  if(r.ot){ for(let v=r.v1;v<=r.v2;v++){ const t=OT[r.b+"."+r.c1+"."+v]; if(t) out.push({b:r.b,c:r.c1,v,t}); } return out; }
  for(let c=r.c1;c<=r.c2;c++){ const ch=G[r.b][c-1]; if(!ch) break;
    const s=c===r.c1?r.v1:1, e=(c===r.c2&&r.v2)?r.v2:ch.length;
    for(let v=s;v<=e;v++) if(ch[v-1]!=null) out.push({b:r.b,c,v,t:ch[v-1]}); }
  return out;
}
function refLabel(ref){
  const r=parseRef(ref); if(!r) return ref;
  const name=r.ot?(OTNAME[r.b]||r.b):BOOK[r.b].name;
  if(r.v2===null) return name+" "+r.c1;
  if(r.c2!==r.c1) return name+" "+r.c1+":"+r.v1+"–"+r.c2+":"+r.v2;
  return name+" "+r.c1+":"+r.v1+(r.v2!==r.v1?"–"+r.v2:"");
}
function passageHTML(ref,{nums=true}={}){
  const vs=versesOf(ref);
  return vs.map(x=>(nums&&vs.length>1?"<sup>"+x.v+"</sup>":"")+fmt(x.t)).join(" ");
}

/* ---------- Icons ---------- */
const IC={
  today:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3.5"/>',
  read:'<path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/>',
  studies:'<path d="M5 4h11l3 3v13H5z"/><path d="M9 9h6M9 13h6M9 17h3"/>',
  plans:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8.5 14.5l2 2 4-4"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  journal:'<path d="M6 3.5h11a1.5 1.5 0 0 1 1.5 1.5v15l-3-2-3 2-3-2-3 2V5A1.5 1.5 0 0 1 6 3.5z"/><path d="M9 8h6M9 12h4"/>',
  guide:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/>',
  prev:'<path d="M15 5l-7 7 7 7"/>', next:'<path d="M9 5l7 7-7 7"/>', gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', play:'<path d="M8 5.5v13l11-6.5z"/>', stop:'<rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/>', ask:'<path d="M4 5h16v11H9l-5 4z"/><path d="M10 9.2a2 2 0 1 1 2.8 1.8c-.5.2-.8.7-.8 1.2M12 14h.01"/>', mem:'<path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/>'
};
const ico=n=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';
const VIEWS=[["today","Today"],["read","Read"],["studies","Studies"],["plans","Plans"],["search","Search"],["journal","Journal"],["guide","Guide"]];

/* ---------- Router ---------- */
let view="today", sub={};
function go(v,opts={}){
  if(tts.on) stopTTS();
  view=v; sub=opts; closeLayer();
  if(location.hash.slice(1)!==v){ try{history.replaceState(null,"","#"+v);}catch(e){ location.hash=v; } }
  render(); window.scrollTo(0,0);
}
const ROUTES=VIEWS.map(x=>x[0]).concat("booklet");
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(h&&h!==view&&ROUTES.includes(h)){view=h;sub={};render();}});
function navHTML(list){return list.map(([k,l])=>'<button data-go="'+k+'"'+(k===view?' aria-current="page"':'')+'>'+ico(k)+'<span>'+l+'</span></button>').join("");}
function render(){
  $("#nav").innerHTML=navHTML(VIEWS)+'<button data-settings>'+ico("gear")+'<span>Settings</span></button>';
  $("#tabs").innerHTML=navHTML(VIEWS.slice(0,6));
  const m=$("#main");
  ({today:vToday,read:vRead,studies:vStudies,plans:vPlans,search:vSearch,journal:vJournal,guide:vGuide,booklet:vBooklet}[view]||vToday)(m);
  railProgress();
}
function railProgress(){const n=Object.keys(S.read).length; $("#railPct").textContent=n+" of "+TOTAL; $("#railMeter").style.width=(n/TOTAL*100)+"%";}

/* ---------- Today ---------- */
function dayOfYear(d=new Date()){return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);}
function nextPlanDay(p){const list=p.build(), done=S.plans[p.id]||{}; for(let i=0;i<list.length;i++) if(!done[i]) return {i,ref:list[i]}; return null;}
function vToday(m){
  const d=new Date(), ref=VOTD[dayOfYear(d)%VOTD.length];
  const hr=d.getHours(), greet=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
  const n=Object.keys(S.read).length, C=2*Math.PI*36;
  const plan=PLANS.find(p=>p.id===S.plan)||PLANS[0], nx=nextPlanDay(plan);
  const lastB=BOOK[S.last.b]||BOOK.Matt;
  const st=STUDIES[dayOfYear(d)%STUDIES.length];
  m.innerHTML='<div class="wrap">'+
  '<section class="hero"><span class="eyebrow">'+d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})+'</span>'+
  '<h1 class="display">'+greet+(viewerName?', '+esc(viewerName):'')+'.</h1>'+
  '<p class="lede">The red letters are the words of Jesus. Read them slowly, mark what speaks to you, and write down what you hear.</p></section>'+
  '<article class="votd" style="margin-top:18px"><span class="eyebrow" style="position:relative">Today\'s words of Jesus</span>'+
  '<div class="scripture" style="margin-top:10px">'+passageHTML(ref,{nums:false})+'</div>'+
  '<footer><span class="ref">'+refLabel(ref)+'</span><span class="row"><button class="btn" data-copy="'+esc(ref)+'">'+ico("copy")+'Copy</button><button class="btn primary" data-open="'+esc(ref)+'">Read in context</button></span></footer></article>'+
  '<div class="today-grid">'+

/* ---------- Reader ---------- */
let selected=new Set();
function vRead(m){
  const b=BOOK[sub.b||S.last.b]||BOOK.Matt, c=Math.min(sub.c||S.last.c||1,G[b.id].length);
  S.last={b:b.id,c}; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  selected.clear();
  const ch=G[b.id][c-1], key=b.id+"."+c, set=S.settings;
  let html="", open=false;
  ch.forEach((t,i)=>{
    const v=i+1, vk=key+"."+v, para=t.startsWith("¶")||i===0;
    if(para){ if(open) html+="</p>"; html+="<p>"; open=true; }
    if(i===0) html+='<span class="dropnum" aria-hidden="true">'+c+'</span>';
    html+='<span class="v" data-v="'+v+'"'+(S.hl[vk]?' data-hl="'+S.hl[vk]+'"':'')+'><sup>'+v+'</sup>'+fmt(t)+(S.notes[vk]?'<span class="notemark" title="Has a note"></span>':'')+'</span> ';
  });
  if(open) html+="</p>";
  const isRead=!!S.read[key];
  const prev=c>1?[b.id,c-1]:(BOOKS[BOOKS.indexOf(b)-1]?[BOOKS[BOOKS.indexOf(b)-1].id,G[BOOKS[BOOKS.indexOf(b)-1].id].length]:null);
  const nb=BOOKS[BOOKS.indexOf(b)+1], next=c<G[b.id].length?[b.id,c+1]:(nb?[nb.id,1]:null);
  m.innerHTML='<div class="wrap">'+
  '<div class="reader-bar"><div class="picker"><select class="sel" id="bookSel" aria-label="Book">'+BOOKS.map(x=>'<option value="'+x.id+'"'+(x===b?' selected':'')+'>'+x.name+'</option>').join("")+'</select>'+
  '<button class="sel" id="chapBtn" aria-label="Choose chapter">Chapter '+c+' ▾</button></div>'+
  '<div class="row"><button class="btn" data-read="'+(prev?prev.join(" "):"")+'" '+(prev?'':'disabled')+' aria-label="Previous chapter">'+ico("prev")+'</button><button class="btn" data-read="'+(next?next.join(" "):"")+'" '+(next?'':'disabled')+' aria-label="Next chapter">'+ico("next")+'</button>'+(canSpeak()?'<button class="btn" id="playBtn" aria-label="Read chapter aloud">'+ico(tts.on?"stop":"play")+'</button>':'')+'<button class="btn" id="setBtn">'+ico("gear")+'Settings</button></div></div>'+
  (c===1?introCard(b):"")+
  '<header class="chap-head"><span class="eyebrow">'+esc(b.title)+'</span><h1 class="chap-title">'+esc(b.titles[c-1])+'</h1><span class="small muted">Chapter '+c+' · '+ch.length+' verses · '+countWJ(ch)+' with words of Jesus</span></header>'+
  '<div class="text '+(set.mode==="verse"?"verses":"")+(set.red?"":" nored")+(set.nums?"":" nonum")+(set.gloss?"":" nogloss")+'" id="text">'+html+'</div>'+
  '<p class="small muted no-print" style="margin-top:6px">Tap a verse to highlight it, add a note, or copy it. Underlined words have a short explanation.</p>'+
  '<div class="chap-foot"><span class="row"><button class="btn '+(isRead?"":"red")+'" id="markRead">'+ico("check")+(isRead?"Read · tap to undo":"Mark chapter as read")+'</button><button class="btn" id="quizBtn">Chapter quiz'+(S.quiz["ch."+b.id+"."+c]?' · best '+S.quiz["ch."+b.id+"."+c].best+'/'+S.quiz["ch."+b.id+"."+c].of:'')+'</button></span>'+
  (next?'<button class="btn primary" data-read="'+next.join(" ")+'">Continue to '+BOOK[next[0]].name+' '+next[1]+' '+ico("next")+'</button>':'')+'</div></div>';
  $("#bookSel").onchange=e=>go("read",{b:e.target.value,c:1});
  $("#chapBtn").onclick=()=>chapterPicker(b,c);
  $("#setBtn").onclick=settingsSheet;
  const pb=$("#playBtn"); if(pb) pb.onclick=()=>{ if(tts.on) stopTTS(); else startTTS(1); };
  $("#quizBtn").onclick=()=>chapterQuiz(b.id,c);
  $("#markRead").onclick=()=>{ if(S.read[key]) delete S.read[key]; else S.read[key]=Date.now(); syncPlanFromRead(); save(); vRead(m); if(S.read[key]) toast("Marked "+b.name+" "+c+" as read"); };
  if(sub.v){ const v1=sub.v, v2=sub.v2||sub.v; sub.v=null; setTimeout(()=>{ const el=$('.v[data-v="'+v1+'"]',m); if(el){ el.scrollIntoView({block:"center",behavior:"smooth"}); for(let v=v1;v<=v2;v++){ const e=$('.v[data-v="'+v+'"]',m); if(e){e.classList.add("flash"); setTimeout(()=>e.classList.remove("flash"),2600);} } } },60); }
}

/* ---------- Search ---------- */
let sq="", sWJ=false;
function vSearch(m){
  m.innerHTML='<div class="wrap"><div class="hero"><span class="eyebrow">Search</span><h1 class="display">Search the Gospels</h1></div>'+
  '<div class="stack" style="margin-top:8px"><input type="search" id="sq" placeholder="Try: faith, kingdom, abide, \'I am\'" value="'+esc(sq)+'" aria-label="Search words">'+
  '<label class="row small" style="gap:8px"><input type="checkbox" id="swj" '+(sWJ?"checked":"")+' style="accent-color:var(--red);width:18px;height:18px"> Only the words of Jesus (red letters)</label></div><div id="sres"></div></div>';
  const inp=$("#sq"); let t;
  inp.oninput=()=>{clearTimeout(t); t=setTimeout(()=>{sq=inp.value; doSearch();},180);};
  $("#swj").onchange=e=>{sWJ=e.target.checked; doSearch();};
  doSearch(); setTimeout(()=>inp.focus({preventScroll:true}),30);
}
function doSearch(){
  const out=$("#sres"); const q=sq.trim();
  if(q.length<2){ out.innerHTML='<div class="empty" style="margin-top:20px">Type a word or phrase to search all 3,779 verses of Matthew, Mark, Luke and John.<div class="row" style="justify-content:center;margin-top:12px">'+["love","believe","kingdom","abide","fear not","verily"].map(w=>'<button class="chip" data-sq="'+w+'">'+w+'</button>').join("")+'</div></div>'; return; }
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/['’]/g,"['’]"),"gi");
  const hits=[], per={};
  BOOKS.forEach(b=>G[b.id].forEach((ch,ci)=>ch.forEach((t,vi)=>{
    let hay=sWJ?(t.match(/\{[^}]*\}/g)||[]).join(" "):t; hay=plain(hay);
    re.lastIndex=0; if(re.test(hay)){ hits.push([b.id,ci+1,vi+1,t]); per[b.id]=(per[b.id]||0)+1; }
  })));
  const shown=hits.slice(0,150);
  out.innerHTML='<div class="counts"><span class="chip" style="color:var(--ink)">'+hits.length+' verses</span>'+BOOKS.map(b=>per[b.id]?'<span class="chip">'+b.name+' '+per[b.id]+'</span>':'').join("")+'</div>'+
  (hits.length?shown.map(([b,c,v,t])=>'<div class="result" data-goto="'+b+'|'+c+'|'+v+'"><span class="ref">'+BOOK[b].name+' '+c+':'+v+'</span><div class="scripture">'+hilite(fmt(t,{gloss:false}),re)+'</div></div>').join("")+(hits.length>150?'<p class="muted small">Showing the first 150. Add another word to narrow the search.</p>':''):'<div class="empty">No verses found for “'+esc(q)+'”. Check the spelling, or try the King James form of the word (for example, “saith” or “believeth”).</div>');
}
function hilite(html,re){ return html.replace(/(^|>)([^<]+)/g,(m,a,txt)=>a+txt.replace(re,x=>"<mark>"+x+"</mark>")); }

/* ---------- Events ---------- */
document.addEventListener("click",e=>{

function seeded(str){ let h=2166136261; for(const ch of str){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%10000)/10000; }; }
function shuffle(arr,rnd=Math.random){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const STOP=new Set("a an and the of to in unto that this these those he she it they them him his her their ye you your thou thee thy thine i me my we us our is are was were be been am shall will hath have had not no nor for but or as so with by from at on upon into out up which who whom what when then there than also all any every one even if lo behold said saith say".split(" "));
const words=t=>t.split(/\s+/).filter(Boolean);
const norm=w=>w.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z']/g,"");

function studyQuestions(id){

function chapterQuestions(b,c){
  const ch=G[b][c-1], rnd=seeded("ch:"+b+c), qs=[];
  const pool=[...new Set(ch.flatMap(t=>words(plain(t)).map(norm)).filter(w=>w.length>=4&&!STOP.has(w)))];
  const cands=shuffle(ch.map((t,i)=>({t,v:i+1})).filter(x=>{const r=(x.t.match(/\{([^}]*)\}/g)||[]).join(" "); return words(r).length>=7;}),rnd);
  const src=cands.length>=2?cands:shuffle(ch.map((t,i)=>({t,v:i+1})).filter(x=>words(plain(x.t)).length>=8),rnd);
  for(const x of src.slice(0,4)){
    const ws=words(plain(x.t)), idxs=ws.map((w,i)=>i).filter(i=>{const n=norm(ws[i]); return n.length>=4&&!STOP.has(n);});
    if(!idxs.length) continue;
    const i=idxs[Math.floor(rnd()*idxs.length)], ans=norm(ws[i]);
    const wrong=shuffle(pool.filter(w=>w!==ans&&Math.abs(w.length-ans.length)<=3),rnd).slice(0,3);
    if(wrong.length<3) continue;
    const shown=ws.map((w,k)=>k===i?w.replace(/[A-Za-z’']+/,"_____"):w).join(" ");
    const red=x.t.includes("{");
    qs.push({q:(red?"Jesus said: ":"Complete the verse: ")+"“"+shown+"”", opts:shuffle([ans,...wrong],rnd), a:ans, ref:b+" "+c+":"+x.v});
  }
  return qs.slice(0,3);
}
function runQuiz(box,id,qs,title){
  let i=0, score=0;
  const step=()=>{
    if(i>=qs.length){
      const best=Math.max(score,(S.quiz[id]||{}).best||0); S.quiz[id]={best,last:score,of:qs.length,at:Date.now()}; save();
      box.innerHTML='<div class="quiz-done"><div class="h2">'+nf(score+" of "+qs.length)+'</div><p class="muted">'+(score===qs.length?"Every answer right. Well done!":score>=qs.length/2?"Good work. Read the verses again for the ones you missed.":"Read the passages again and try once more.")+'</p><button class="btn" data-quiz-again>Try again</button></div>';
      $("[data-quiz-again]",box).onclick=()=>{i=0;score=0;step();};
      return;
    }
    const q=qs[i];
    box.innerHTML='<div class="quiz-q"><span class="eyebrow">'+esc(title)+' · Question '+(i+1)+' of '+qs.length+'</span><p class="quiz-text">'+esc(q.q)+'</p><div class="quiz-opts">'+q.opts.map((o,k)=>'<button class="quiz-opt" data-k="'+k+'">'+esc(o)+'</button>').join("")+'</div><div class="quiz-after" hidden></div></div>';
    $$(".quiz-opt",box).forEach(btn=>btn.onclick=()=>{
      const pick=q.opts[+btn.dataset.k], ok=pick===q.a; if(ok) score++;
      $$(".quiz-opt",box).forEach(b2=>{ b2.disabled=true; const o=q.opts[+b2.dataset.k]; if(o===q.a) b2.classList.add("right"); else if(b2===btn) b2.classList.add("wrong"); });
      const af=$(".quiz-after",box); af.hidden=false;
      af.innerHTML='<p class="quiz-verdict '+(ok?"ok":"no")+'">'+(ok?"Correct.":"Not quite. The answer is “"+esc(q.a)+"”.")+'</p><blockquote class="passage scripture">'+passageHTML(q.ref)+'<div class="ref" style="margin-top:4px">'+refLabel(q.ref)+'</div></blockquote><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" data-quiz-next>'+(i+1<qs.length?"Next question":"See my score")+'</button></div>';
      $("[data-quiz-next]",af).onclick=()=>{i++;step();};
    });
  };
  step();
}
function chapterQuiz(b,c){
  const qs=chapterQuestions(b,c);
  openModal('<div class="sheet-head"><div><span class="eyebrow">Chapter quiz</span><h2 class="h2">'+BOOK[b].name+' '+nf(c)+'</h2></div><button class="btn" data-close aria-label="Close">'+ico("x")+'</button></div><div id="quizBox"></div>');
  runQuiz($("#quizBox"),"ch."+b+"."+c,qs,BOOK[b].name+" "+c);
}

/* ---------- Memory verses ---------- */
const MEM_STEPS=["Read","Fill in","First letters","Recite"];
function memoryList(){
  const list=STUDIES.map(s=>({ref:s.memory,from:s.title}));
  Object.keys(S.memory).forEach(r=>{ if(!list.some(x=>x.ref===r)) list.push({ref:r,from:"Added by you"}); });
  return list;
}
const memText=ref=>versesOf(ref).map(x=>plain(x.t)).join(" ");
function memoryHTML(){
  const list=memoryList(), mastered=list.filter(x=>S.memory[x.ref]?.mastered).length;
  return '<p class="lede" style="margin-bottom:16px">Hide God\'s word in your heart, one verse at a time. Each verse has four steps, from reading it to saying it from memory. You have learned '+mastered+' of '+list.length+'. To add any verse, tap it in the reader and choose “Memorize.”</p>'+
  '<div class="grid">'+list.map(x=>{const m=S.memory[x.ref]||{}; const st=m.mastered?4:(m.step||0);
    return '<article class="card mem-card"><div class="row" style="justify-content:space-between"><span class="ref">'+refLabel(x.ref)+'</span>'+(m.mastered?'<span class="chip" style="color:var(--red)">Learned</span>':'')+'</div>'+
    '<div class="scripture" style="font-size:1rem;line-height:1.6">'+passageHTML(x.ref,{nums:false})+'</div>'+
    '<div class="mem-steps" aria-label="Progress">'+MEM_STEPS.map((n,k)=>'<span class="'+(k<st?"on":"")+'" title="'+n+'"></span>').join("")+'</div>'+
    '<div class="row" style="justify-content:space-between"><span class="small muted">'+esc(x.from)+'</span><button class="btn red" data-mem="'+esc(x.ref)+'">'+(m.mastered?"Review":st?"Continue":"Start")+'</button></div></article>';}).join("")+'</div>';
}
function memPractice(ref,step){
  const m=S.memory[ref]=S.memory[ref]||{step:0};
  if(step==null) step=m.mastered?3:Math.min(m.step||0,3);
  const text=memText(ref), ws=words(text);
  const head='<div class="sheet-head"><div><span class="eyebrow">Memory verse · Step '+(step+1)+' of 4: '+MEM_STEPS[step]+'</span><h2 class="h2">'+nf(refLabel(ref))+'</h2></div><button class="btn" data-close aria-label="Close">'+ico("x")+'</button></div>'+
    '<div class="seg" style="margin-bottom:16px">'+MEM_STEPS.map((n,k)=>'<button data-mstep="'+k+'" aria-pressed="'+(k===step)+'">'+n+'</button>').join("")+'</div>';
  const advance=()=>{ if(step+1>(m.step||0)) m.step=Math.min(step+1,4); save(); memPractice(ref,Math.min(step+1,3)); };
  if(step===0){
    openModal(head+'<div class="scripture mem-big">'+passageHTML(ref,{nums:false})+'</div><p class="muted small">Read it aloud slowly three times. Notice where each phrase begins.</p><div class="row" style="justify-content:flex-end">'+(canSpeak()?'<button class="btn" id="memListen">'+ico("play")+'Listen</button>':'')+'<button class="btn primary" id="memNext">I\'ve read it</button></div>');
    const l=$("#memListen"); if(l) l.onclick=()=>speakOnce(text);
    $("#memNext").onclick=advance;
  } else if(step===1){
    const rnd=seeded(ref+Date.now());
    const blanks=ws.map((w,i)=>i).filter(i=>{const n=norm(ws[i]); return n.length>=3&&!STOP.has(n)&&rnd()<0.55;}).slice(0,10);
    if(!blanks.length) blanks.push(0);
    let next=0, misses=0;
    const bank=shuffle(blanks.map(i=>ws[i].replace(/[^A-Za-z’']/g,"")),rnd);
    const draw=()=>ws.map((w,i)=>{const k=blanks.indexOf(i); if(k<0) return esc(w); if(k<next) return '<span class="mem-filled">'+esc(w)+'</span>'; return '<span class="mem-blank'+(k===next?" cur":"")+'">'+"&nbsp;".repeat(Math.max(4,w.length))+'</span>';}).join(" ");
    openModal(head+'<div class="scripture mem-big" id="memText">'+draw()+'</div><p class="muted small">Tap the words in order to fill each blank.</p><div class="mem-bank" id="memBank">'+bank.map((w,k)=>'<button class="chip" data-w="'+k+'">'+esc(w)+'</button>').join("")+'</div><p class="small muted" id="memMsg" aria-live="polite"></p>');
    $$("#memBank [data-w]").forEach(b=>b.onclick=()=>{
      const want=norm(ws[blanks[next]]);
      if(norm(b.textContent)===want){ b.disabled=true; b.classList.add("used"); next++; $("#memText").innerHTML=draw();
        if(next>=blanks.length){ $("#memMsg").textContent=misses?"Done, with "+misses+" slip"+(misses>1?"s":"")+".":"Perfect!"; setTimeout(advance,900); } }
      else { misses++; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); }
    });
  } else if(step===2){
    openModal(head+'<div class="scripture mem-big mem-letters">'+ws.map((w,i)=>'<button class="ml" data-i="'+i+'" data-w="'+esc(w)+'">'+esc(w.replace(/([A-Za-z])[A-Za-z’']*/,(m0,f)=>f+"_".repeat(Math.max(0,m0.length-1))))+'</button>').join(" ")+'</div><p class="muted small">Say the verse using only the first letters. Tap a word if you get stuck.</p><div class="row" style="justify-content:flex-end"><button class="btn" id="memShow">Show all</button><button class="btn primary" id="memNext">I can say it</button></div>');
    $$(".ml").forEach(b=>b.onclick=()=>{b.textContent=b.dataset.w; b.classList.add("shown");});
    $("#memShow").onclick=()=>$$(".ml").forEach(b=>{b.textContent=b.dataset.w; b.classList.add("shown");});
    $("#memNext").onclick=advance;
  } else {
    openModal(head+'<label class="muted small" for="memType">Type the verse from memory. Spelling and punctuation don\'t need to be exact.</label><textarea id="memType" style="margin-top:8px" autocomplete="off" spellcheck="false"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" id="memCheck">Check</button></div><div id="memResult"></div>');
    $("#memCheck").onclick=()=>{
      const a=ws.map(norm).filter(Boolean), bw=words($("#memType").value).map(norm).filter(Boolean);
      const dp=Array.from({length:a.length+1},()=>new Array(bw.length+1).fill(0));
      for(let i=a.length-1;i>=0;i--) for(let j=bw.length-1;j>=0;j--) dp[i][j]=a[i]===bw[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
      const hit=new Set(); let i=0,j=0; while(i<a.length&&j<bw.length){ if(a[i]===bw[j]){hit.add(i);i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
      const pct=Math.round(dp[0][0]/a.length*100), extra=bw.length-dp[0][0];
      const okPct=pct>=90&&extra<=Math.max(2,a.length*0.1);
      let wi=0; const shown=ws.map(w=>{ if(!norm(w)) return esc(w); const k=wi++; return hit.has(k)?esc(w):'<span class="mem-miss">'+esc(w)+'</span>'; }).join(" ");
      if(okPct&&!m.mastered){ m.mastered=Date.now(); m.step=4; save(); }
      $("#memResult").innerHTML='<div class="memory" style="margin-top:14px"><div class="h2" style="font-size:1.3rem">'+nf(pct+"%")+' '+(okPct?"Learned!":"Almost there")+'</div><p class="small muted" style="margin:4px 0 8px">'+(okPct?"This verse is now marked as learned. Review it now and then to keep it fresh.":"Words you missed are underlined in red. Try again, or go back a step.")+'</p><div class="scripture" style="font-size:1rem">'+shown+'</div></div>';
      if(okPct) toast("Verse learned");
    };
  }
  $$("[data-mstep]").forEach(b=>b.onclick=()=>memPractice(ref,+b.dataset.mstep));
}

/* ---------- Compare the Gospels ---------- */
const COMMON=new Set("there their these those where which while about after again before being cometh came come going went other things thing great saying spake answered unto would could should shall might began certain therefore because".split(" "));
function stem(w){ return w.replace(/(eth|est|ed|es|s)$/,""); }
function compareHTML(idx){
  const list=HARMONY.map((h,i)=>({h,i})).filter(x=>Object.keys(x.h.r).length>1);
  if(idx==null||!HARMONY[idx]||Object.keys(HARMONY[idx].r).length<2) idx=list[0].i;
  const h=HARMONY[idx], ids=BOOKS.map(b=>b.id).filter(id=>h.r[id]);
  const wordSets={}; ids.forEach(id=>{ wordSets[id]=new Set(versesOf(h.r[id]).flatMap(x=>words(plain(x.t)).map(w=>stem(norm(w))))); });
  const uniq=id=>{ const others=ids.filter(o=>o!==id); return w=>{ const s=stem(norm(w)); return (w.length>=5||/^[A-Z][a-z]{2,}/.test(w))&&!STOP.has(norm(w))&&!COMMON.has(norm(w))&&others.every(o=>!wordSets[o].has(s)); }; };
  const cols=ids.map(id=>{
    const isU=uniq(id), vs=versesOf(h.r[id]);
    const html=vs.map(x=>"<sup>"+x.v+"</sup>"+fmt(x.t,{gloss:false}).replace(/(^|>)([^<]+)/g,(m0,a,txt)=>a+txt.replace(/[A-Za-z’']+/g,w=>isU(w)?'<span class="uniq">'+w+'</span>':w))).join(" ");
    const wj=vs.filter(x=>x.t.includes("{")).length;
    return '<article class="cmp-col"><header><span class="h2" style="font-size:1.25rem">'+BOOK[id].name+'</span><button class="chip" data-open="'+h.r[id]+'">'+h.r[id].replace(/^\w+ /,"")+'</button></header><div class="small muted">'+vs.length+' verses · '+wj+' with words of Jesus</div><div class="scripture cmp-text">'+html+'</div></article>';
  }).join("");
  return '<p class="lede" style="margin-bottom:14px">Read one event as each Gospel writer tells it. Words found in only one account are <span class="uniq">underlined</span>, which shows the details each writer chose to include.</p>'+
  '<div class="row" style="margin-bottom:14px"><label class="small muted" for="cmpSel">Event</label><select class="sel" id="cmpSel">'+list.map(x=>'<option value="'+x.i+'"'+(x.i===idx?" selected":"")+'>'+esc(x.h.e)+'</option>').join("")+'</select>'+
  '<label class="row small" style="gap:8px"><input type="checkbox" id="cmpU" '+(S.settings.uniq!==false?"checked":"")+' style="accent-color:var(--red);width:18px;height:18px"> Mark unique words</label></div>'+
  '<div class="cmp '+(S.settings.uniq===false?"nouniq":"")+'" style="--n:'+ids.length+'">'+cols+'</div>';
}

/* ---------- Read aloud ---------- */
const canSpeak=()=>"speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined";
let tts={on:false,b:null,c:null,v:1,u:null};
function voiceList(){ try{ return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); }catch(e){ return []; } }
function pickVoice(){ try{ const vs=voiceList(); const saved=S.settings.voice&&vs.find(v=>v.name===S.settings.voice); if(saved) return saved; return vs.find(v=>/natural|google|samantha|daniel|aria|jenny|guy/i.test(v.name))||vs[0]||null; }catch(e){ return null; } }
function speakOnce(text){ if(!canSpeak()) return; stopTTS(); const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; const v=pickVoice(); if(v) try{u.voice=v;}catch(e){} u.rate=S.settings.rate||0.95; tts.u=u; speechSynthesis.speak(u); }
function startTTS(v){ if(!canSpeak()) return; speechSynthesis.cancel(); tts={on:true,b:S.last.b,c:S.last.c,v:v||1,u:null}; speakVerse(); renderPlayer(); }
function speakVerse(){
  if(!tts.on) return;
  const ch=G[tts.b][tts.c-1];
  if(tts.v>ch.length){
    const bi=BOOKS.findIndex(x=>x.id===tts.b);
    const next=tts.c<G[tts.b].length?[tts.b,tts.c+1]:(BOOKS[bi+1]?[BOOKS[bi+1].id,1]:null);
    if(next&&S.settings.autoNext!==false){ tts.on=false; go("read",{b:next[0],c:next[1]}); setTimeout(()=>startTTS(1),350); return; }
    stopTTS(); toast("Finished "+BOOK[tts.b].name+" "+tts.c); return;
  }
  $$(".v.speaking").forEach(e=>e.classList.remove("speaking"));
  const el=view==="read"&&S.last.b===tts.b&&S.last.c===tts.c?$('.v[data-v="'+tts.v+'"]'):null;
  if(el){ el.classList.add("speaking"); const r=el.getBoundingClientRect(); if(r.top<80||r.bottom>innerHeight-140) el.scrollIntoView({block:"center",behavior:"smooth"}); }
  const u=new SpeechSynthesisUtterance(plain(ch[tts.v-1])); u.lang="en-US"; const vc=pickVoice(); if(vc) try{u.voice=vc;}catch(e){} u.rate=S.settings.rate||0.95;
  u.onend=()=>{ if(tts.on&&tts.u===u){ tts.v++; speakVerse(); } };
  u.onerror=e=>{ if(e.error!=="interrupted"&&e.error!=="canceled") stopTTS(); };
  tts.u=u; speechSynthesis.speak(u); renderPlayer();
}
function stopTTS(){ tts.on=false; tts.u=null; try{ speechSynthesis.cancel(); }catch(e){} $$(".v.speaking").forEach(e=>e.classList.remove("speaking")); renderPlayer(); }
function renderPlayer(){
  let p=$("#player");
  if(!tts.on){ if(p) p.remove(); const pb=$("#playBtn"); if(pb) pb.innerHTML=ico("play"); return; }
  if(!p){ p=document.createElement("div"); p.id="player"; p.className="player"; document.body.appendChild(p); }
  p.innerHTML='<span class="small"><b>Reading aloud</b> · '+BOOK[tts.b].name+' '+tts.c+':'+tts.v+'</span><span class="row" style="gap:6px"><button class="btn" id="ttsRate" aria-label="Reading speed">'+(S.settings.rate||0.95)+'×</button><button class="btn" id="ttsStop">'+ico("stop")+'Stop</button></span>';
  $("#ttsStop").onclick=stopTTS;
  $("#ttsRate").onclick=()=>{ const rs=[0.8,0.95,1.1,1.25]; const i=rs.indexOf(S.settings.rate||0.95); S.settings.rate=rs[(i+1)%rs.length]; save(); const v=tts.v; startTTS(v); };
  const pb=$("#playBtn"); if(pb) pb.innerHTML=ico("stop");
}
if(canSpeak()){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }

/* ---------- Ask about a passage (Claude version only) ---------- */
let sampleFn=null;
async function connectAsk(){ const C=window.claude; if(!C||!C.use) return; try{ sampleFn=await C.use("sample"); }catch(e){ sampleFn=null; } if(sampleFn){ document.documentElement.classList.add("can-ask"); } }
function md(text){
  const lines=esc(text).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").split(/\n/);
  let out="", inList=false;
  for(const l of lines){ const m=l.match(/^\s*(?:[-•]|\d+\.)\s+(.*)/);
    if(m){ if(!inList){out+="<ul>";inList=true;} out+="<li>"+m[1]+"</li>"; continue; }
    if(inList){out+="</ul>";inList=false;}
    if(/^#{1,4}\s/.test(l)) out+="<p><b>"+l.replace(/^#+\s*/,"")+"</b></p>"; else if(l.trim()) out+="<p>"+l+"</p>"; }
  if(inList) out+="</ul>"; return out;
}
let askCtl=null;
function askModal(ref){
  if(!sampleFn) return;
  const text=versesOf(ref).map(x=>(versesOf(ref).length>1?x.v+" ":"")+plain(x.t)).join(" ");
  const presets=["Explain this in plain words","What was happening here?","How can I live this out this week?","Where else does the Bible speak to this?"];
  openModal('<div class="sheet-head"><div><span class="eyebrow">Ask about this passage</span><h2 class="h2">'+nf(refLabel(ref))+'</h2></div><button class="btn" data-close aria-label="Close">'+ico("x")+'</button></div>'+
    '<blockquote class="passage scripture" style="font-size:1rem;line-height:1.6">'+passageHTML(ref)+'</blockquote>'+
    '<div class="row" style="margin:14px 0">'+presets.map(p=>'<button class="chip" data-askp="'+esc(p)+'">'+esc(p)+'</button>').join("")+'</div>'+
    '<label class="small muted" for="askQ">Or ask your own question</label><textarea id="askQ" style="min-height:70px;margin-top:6px" placeholder="What does Jesus mean by…"></textarea>'+
    '<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="askStop" hidden>Stop</button><button class="btn primary" id="askGo">Ask</button></div>'+
    '<div id="askOut" class="ask-out" aria-live="polite"></div><p class="small muted" style="margin-top:10px">Answers come from Claude. Weigh them against Scripture, as the Bereans did (Acts 17:11).</p>');
  const go2=async q=>{
    q=(q||"").trim(); if(!q) { $("#askQ").focus(); return; }
    askCtl?.abort(); askCtl=new AbortController();
    const out=$("#askOut"), stop=$("#askStop"), btn=$("#askGo");
    out.innerHTML='<p class="muted">Thinking…</p>'; stop.hidden=false; btn.disabled=true;
    const prompt="You are helping a Christian reader study the words of Jesus in the four Gospels, King James Version. Answer the reader's question about the passage below. Be faithful to Scripture, warm and clear, in plain modern English, around 150 to 250 words unless the question truly needs more. When you cite Scripture, quote the King James Version and give the reference. Where Christians hold different interpretations, say so briefly and fairly. Do not invent historical details; say plainly when something is uncertain. Use short paragraphs or a short bulleted list; no headings.\n\nPassage ("+refLabel(ref)+", KJV):\n"+text+"\n\nReader's question: "+q;
    try{ await sampleFn(prompt,{signal:askCtl.signal,onText:({text})=>{ out.innerHTML=md(text); }}); }
    catch(e){ if(e&&e.text) out.innerHTML=md(e.text); else out.innerHTML="";
      if(!e||e.code!=="cancelled") out.insertAdjacentHTML("beforeend",'<p class="small" style="color:var(--red)">'+(e&&e.code==="not_granted"?"Asking Claude was not allowed for this page. You can allow it from the page's permissions.":e&&e.code==="rate_limited"?"Too many questions at once. Wait a moment, then ask again.":"The answer could not be finished. Try asking again.")+'</p>'); }
    finally{ stop.hidden=true; btn.disabled=false; }
  };
  $$("[data-askp]").forEach(b=>b.onclick=()=>{ $("#askQ").value=b.dataset.askp; go2(b.dataset.askp); });
  $("#askGo").onclick=()=>go2($("#askQ").value);
  $("#askStop").onclick=()=>askCtl?.abort();
}

applySettings();
const h=location.hash.slice(1); if(ROUTES.includes(h)) view=h;
render();
connect();
connectAsk();
})();
</script>
